name: Deploy CherryStock Frontend
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export Yahoo Finance 1Y OHLC
        run: |
          python -m pip install 'yfinance>=0.2.60,<1.0' pandas
          python scripts/export_intermarket_yahoo.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        env:
          VITE_MARKET_DATA_SOURCE: ${{ vars.CHERRYSTOCK_MARKET_DATA_SOURCE || 'mock' }}
          VITE_R2_PUBLIC_BASE_URL: ${{ vars.CHERRYSTOCK_R2_PUBLIC_BASE_URL }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
