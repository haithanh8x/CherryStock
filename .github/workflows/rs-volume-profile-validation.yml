name: R/S Volume Profile Validation

on:
  pull_request:
    paths:
      - ".github/workflows/rs-volume-profile-validation.yml"
      - "src/calcEngine/volumeProfile.py"
      - "src/calcEngine/levelLadder.py"
      - "src/Chart/levelLadderChart.py"
      - "src/webapp/NiceGUI_chart.py"
      - "src/calcEngine/rsEvaluation.py"
      - "scripts/compare_rs_volume_profile.py"
      - "tests/test_rs_ladder.py"
      - "tests/test_rs_evaluation.py"
      - "tests/test_rs_volume_profile_p0_p2.py"
  push:
    paths:
      - ".github/workflows/rs-volume-profile-validation.yml"
      - "src/calcEngine/volumeProfile.py"
      - "src/calcEngine/levelLadder.py"
      - "src/Chart/levelLadderChart.py"
      - "src/webapp/NiceGUI_chart.py"
      - "scripts/compare_rs_volume_profile.py"
      - "tests/test_rs_volume_profile_p0_p2.py"

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DUCKDB_ENV: local
      DATA_DIR: /tmp/cherrystock-data
      LOCAL_DB_PATH: /tmp/cherrystock-data/CherryMon-test.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas numpy duckdb python-dotenv
      - name: Compile changed modules
        run: |
          python -m py_compile src/calcEngine/volumeProfile.py src/calcEngine/levelLadder.py
          python -m py_compile src/Chart/levelLadderChart.py src/webapp/NiceGUI_chart.py
          python -m py_compile scripts/compare_rs_volume_profile.py tests/test_rs_volume_profile_p0_p2.py
      - name: Collect R/S tests
        run: python -m pytest tests/test_rs_ladder.py tests/test_rs_evaluation.py tests/test_rs_volume_profile_p0_p2.py --collect-only -q
      - name: Run R/S unit and regression tests
        run: python -m pytest tests/test_rs_ladder.py tests/test_rs_evaluation.py tests/test_rs_volume_profile_p0_p2.py -q
