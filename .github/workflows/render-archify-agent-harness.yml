name: Render Archify Agent Harness

on:
  push:
    branches:
      - main
    paths:
      - "docs/architecture/diagrams/cherrystock-adlc-agent-harness.workflow.json"
      - "docs/architecture/agent-harness/AGENT_EXECUTION_FLOW.md"
      - "scripts/customize_archify_typography.py"
      - ".github/workflows/render-archify-agent-harness.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-archify-agent-harness-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCHIFY_VERSION: v2.16.0
  ARCHIFY_UPDATE_CHECK_DISABLED: "1"
  SOURCE_FILE: docs/architecture/diagrams/cherrystock-adlc-agent-harness.workflow.json
  OUTPUT_FILE: docs/architecture/generated/CherryStock_ADLC_Agent_Harness.html
  STATUS_FILE: docs/architecture/agent-harness/README.md

jobs:
  render:
    name: Validate and render ADLC workflow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CherryStock
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download pinned Archify release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .archify-tool
          mkdir -p .archify-tool
          curl -fsSL "https://github.com/tt-a1i/archify/releases/download/${ARCHIFY_VERSION}/archify.zip" -o /tmp/archify.zip
          unzip -q /tmp/archify.zip -d .archify-tool
          ARCHIFY_CLI="$(find .archify-tool -type f -path '*/bin/archify.mjs' -print -quit)"
          if [[ -z "${ARCHIFY_CLI}" ]]; then
            echo "Archify CLI was not found in the release archive."
            find .archify-tool -maxdepth 4 -type f | sort | head -200
            exit 1
          fi
          echo "ARCHIFY_CLI=${ARCHIFY_CLI}" >> "$GITHUB_ENV"
          node "${ARCHIFY_CLI}" doctor || true

      - name: Validate CherryStock ADLC workflow
        shell: bash
        run: |
          set -euo pipefail
          node "$ARCHIFY_CLI" validate workflow "$SOURCE_FILE" --quality showcase --json

      - name: Deliver CherryStock ADLC workflow HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUTPUT_FILE")"
          node "$ARCHIFY_CLI" deliver workflow "$SOURCE_FILE" "$OUTPUT_FILE" --quality showcase --json

      - name: Apply CherryStock typography
        shell: bash
        run: |
          set -euo pipefail
          python scripts/customize_archify_typography.py "$OUTPUT_FILE" --sans-font Inter
          test -s "$OUTPUT_FILE"
          grep -q "CherryStock ADLC Agent Harness" "$OUTPUT_FILE"

      - name: Synchronize ADLC visualization status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/architecture/agent-harness/README.md")
          text = path.read_text(encoding="utf-8")

          pending = """## Artifact status for this ADLC visualization

          - Canonical ADLC Markdown: **UPDATED**
          - Archify typed workflow source: **UPDATED**
          - Archify schema/layout/composition validation: **PENDING_LOCAL_ARCHIFY_VALIDATION_AND_RENDER**
          - Generated HTML: **PENDING_LOCAL_ARCHIFY_VALIDATION_AND_RENDER**

          The repository change must not be treated as Archify-validated or as a synchronized generated visualization until `scripts/render_archify_agent_harness.ps1` succeeds locally and the generated HTML is committed. Generated HTML must not be hand-edited to bypass this gate.
          """

          synchronized = """## Artifact status for this ADLC visualization

          - Canonical ADLC Markdown: **UPDATED**
          - Detailed agent/file execution map: **UPDATED** — `docs/architecture/agent-harness/AGENT_EXECUTION_FLOW.md`
          - Archify typed workflow source: **VALIDATED (showcase)** — `docs/architecture/diagrams/cherrystock-adlc-agent-harness.workflow.json`
          - Generated HTML: **SYNCHRONIZED** — `docs/architecture/generated/CherryStock_ADLC_Agent_Harness.html`
          - GitHub renderer: **ACTIVE** — `.github/workflows/render-archify-agent-harness.yml`

          The typed workflow is validated and rendered on GitHub with pinned Archify `v2.16.0`. The generated HTML is presentation output only and must not be hand-edited. Changes to agent routing, gates, file ownership or execution flow must update the canonical Markdown and typed Archify source, then pass this workflow before the visualization is treated as synchronized.
          """

          if pending in text:
              text = text.replace(pending, synchronized, 1)
              path.write_text(text, encoding="utf-8")
          elif synchronized in text:
              print("ADLC visualization status is already synchronized.")
          else:
              raise SystemExit("Expected ADLC visualization status block was not found; update the workflow replacement contract.")
          PY

      - name: Commit regenerated artifact and synchronized status
        shell: bash
        run: |
          set -euo pipefail
          git add "$OUTPUT_FILE" "$STATUS_FILE"
          if git diff --cached --quiet; then
            echo "Generated artifact and status are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(archify): regenerate CherryStock ADLC agent harness"
          git push
