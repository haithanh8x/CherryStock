name: SmartMoney Validation

on:
  push:
    paths:
      - ".github/workflows/smart-money-validation.yml"
      - "pyproject.toml"
      - "run.py"
      - "src/calcEngine/smartMoneyScore.py"
      - "src/calcEngine/smartMoneyEvaluation.py"
      - "src/cherrystock/config/settings.py"
      - "src/cherrystock/application/services/sync_write_pipeline.py"
      - "src/Ults/DataValidation.py"
      - "src/Ults/DataQualityOrchestration.py"
      - "src/cherrystock/infrastructure/database/repositories/smart_money_repository.py"
      - "src/cherrystock/infrastructure/database/unit_of_work.py"
      - "src/DuckDB/sql/smart_money_v1_schema.sql"
      - "src/DuckDB/sql/smart_money_v1_preflight.sql"
      - "src/webapp/NiceGUI_chart.py"
      - "src/webapp/smart_money_tab.py"
      - "src/webapp/smart_money_state_flow.py"
      - "scripts/initload/init_reload_smart_money_score.py"
      - "scripts/run_smart_money.py"
      - "scripts/run_smart_money_preflight.py"
      - "scripts/validate_smart_money_incremental.py"
      - "scripts/validate_smart_money_ui_snapshot.py"
      - "scripts/evaluate_smart_money_v1.py"
      - "tests/test_smart_money_score.py"
      - "tests/test_smart_money_evaluation.py"
      - "tests/test_smart_money_integration.py"
      - "tests/test_smart_money_strategy.py"
      - "tests/test_smart_money_state_flow.py"
      - "tests/test_sync_write_pipeline_service.py"
      - "tests/test_data_quality_orchestration.py"
  pull_request:
    paths:
      - ".github/workflows/smart-money-validation.yml"
      - "pyproject.toml"
      - "run.py"
      - "src/Ults/DataValidation.py"
      - "src/Ults/DataQualityOrchestration.py"
      - "src/calcEngine/smartMoneyScore.py"
      - "src/calcEngine/smartMoneyEvaluation.py"
      - "src/cherrystock/config/settings.py"
      - "src/cherrystock/application/services/sync_write_pipeline.py"
      - "src/cherrystock/infrastructure/database/repositories/smart_money_repository.py"
      - "src/cherrystock/infrastructure/database/unit_of_work.py"
      - "src/DuckDB/sql/smart_money_v1_schema.sql"
      - "src/DuckDB/sql/smart_money_v1_preflight.sql"
      - "src/webapp/NiceGUI_chart.py"
      - "src/webapp/smart_money_tab.py"
      - "src/webapp/smart_money_state_flow.py"
      - "scripts/initload/init_reload_smart_money_score.py"
      - "scripts/run_smart_money.py"
      - "scripts/run_smart_money_preflight.py"
      - "scripts/validate_smart_money_incremental.py"
      - "scripts/validate_smart_money_ui_snapshot.py"
      - "scripts/evaluate_smart_money_v1.py"
      - "tests/test_data_quality_orchestration.py"
      - "tests/test_sync_write_pipeline_service.py"
      - "tests/test_smart_money_score.py"
      - "tests/test_smart_money_evaluation.py"
      - "tests/test_smart_money_integration.py"
      - "tests/test_smart_money_strategy.py"
      - "tests/test_smart_money_state_flow.py"

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DUCKDB_ENV: local
      DATA_DIR: /tmp/cherrystock-data
      LOCAL_DB_PATH: /tmp/cherrystock-data/CherryMon-test.duckdb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas numpy duckdb python-dotenv yfinance pandas-ta-classic

      - name: Compile SmartMoney modules
        run: |
          python -m py_compile run.py
          python -m py_compile src/calcEngine/smartMoneyScore.py
          python -m py_compile src/calcEngine/smartMoneyEvaluation.py
          python -m py_compile src/cherrystock/infrastructure/database/repositories/smart_money_repository.py
          python -m py_compile src/cherrystock/infrastructure/database/unit_of_work.py
          python -m py_compile src/cherrystock/application/services/sync_write_pipeline.py
          python -m py_compile src/Ults/DataQualityOrchestration.py
          python -m py_compile src/Ults/DataValidation.py
          python -m py_compile src/cherrystock/config/settings.py
          python -m py_compile src/webapp/NiceGUI_chart.py
          python -m py_compile src/webapp/smart_money_tab.py
          python -m py_compile src/webapp/smart_money_state_flow.py
          python -m py_compile scripts/initload/init_reload_smart_money_score.py
          python -m py_compile scripts/run_smart_money.py
          python -m py_compile scripts/run_smart_money_preflight.py
          python -m py_compile scripts/validate_smart_money_incremental.py
          python -m py_compile scripts/validate_smart_money_ui_snapshot.py
          python -m py_compile scripts/evaluate_smart_money_v1.py

      - name: Collect focused SmartMoney tests
        run: |
          python -m pytest tests/test_smart_money_strategy.py tests/test_smart_money_integration.py tests/test_smart_money_state_flow.py --collect-only -q

      - name: Run focused unit tests
        run: |
          python -m pytest tests/test_smart_money_score.py tests/test_smart_money_evaluation.py tests/test_smart_money_integration.py tests/test_smart_money_strategy.py tests/test_smart_money_state_flow.py tests/test_sync_write_pipeline_service.py tests/test_data_quality_orchestration.py -v
